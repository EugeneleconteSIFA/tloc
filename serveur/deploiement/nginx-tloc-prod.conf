# /etc/nginx/sites-available/tloc.kernse.fr — généré depuis serveur/nginx-tloc.conf
server {
    listen 80;
    listen [::]:80;
    server_name tloc.kernse.fr;
    # certbot remplacera ce bloc par sa redirection vers le 443

    root /srv/tloc/prod/site;
    disable_symlinks off;       # la prod est un lien vers sa version en cours
    index connexion.html;      # le portail ; l'accueil du compte est accueil.html


    # le code du serveur, les bases et les scripts ne se servent jamais en fichiers
    location ^~ /serveur/ { deny all; }
    location ~ /\.(git|ht) { deny all; }
    location ~ \.(py|db|sh|md|conf)$ { deny all; }

    # le jeu : fichiers statiques, rien à compiler
    location / {
        try_files $uri $uri/ =404;
    }

    # les modules ES et les .glb doivent partir avec le bon type. La table standard D'ABORD :
    # un bloc « types » seul la remplace en entier, et le HTML partait alors en
    # application/octet-stream — le navigateur téléchargeait la page au lieu de l'ouvrir.
    include /etc/nginx/mime.types;
    types {
        application/javascript  js mjs;
        model/gltf-binary       glb;
        model/gltf+json         gltf;
    }

    # trois mégaoctets de three.js et de modèles : on compresse et on met en cache
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml application/octet-stream model/gltf-binary model/gltf+json;
    gzip_comp_level 5;
    # le code : revérifié à chaque chargement (une réponse 304 ne coûte presque rien). Mis
    # en cache 7 jours, un module sans ?v= restait périmé une semaine chez les testeurs,
    # mêlé aux modules neufs — la pire des pannes, celle qu'on ne voit pas chez soi.
    location ~* \.(js|mjs|css|json)$ {
        add_header Cache-Control "no-cache";
    }
    # les textures et les modèles : lourds (40 Mo), rarement changés — gardés un jour
    location ~* \.(webp|png|jpg|jpeg|bin|glb|gltf|woff2|mp3|ogg|wav)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
    location = /connexion.html { expires -1; }
    location = /accueil.html   { expires -1; }
    location = /index.html   { expires -1; }

    # l'API des comptes et des instances
    location /api/ {
        proxy_pass http://127.0.0.1:8130;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # le relais multijoueur : WebSocket, connexions longues
    location /ws/ {
        proxy_pass http://127.0.0.1:8130;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    client_max_body_size 4m;
}
