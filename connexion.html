<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>The Legend of Camille — Connexion</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF8F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Grenze+Gotisch:wght@700&family=Grenze:wght@500;600&display=swap">
<script>
  // Le thème est posé avant la feuille de style : sinon la page s'affiche un instant en
  // sombre puis bascule. Clair par défaut : c'est le plus lisible ; la nuit reste à un clic.
  (() => {
    let t = 'clair';
    try { t = localStorage.getItem('tloc_theme') || 'clair'; } catch (e) {}
    document.documentElement.dataset.theme = t;
    document.addEventListener('DOMContentLoaded', () => {
      const b = document.getElementById('basculeTheme');
      if (!b) return;
      const poser = (th) => {
        document.documentElement.dataset.theme = th;
        b.setAttribute('aria-checked', String(th === 'clair'));
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = th === 'clair' ? '#FBF8F2' : '#151C2D';
      };
      poser(document.documentElement.dataset.theme);
      b.onclick = () => {
        const th = document.documentElement.dataset.theme === 'clair' ? 'sombre' : 'clair';
        poser(th);
        try { localStorage.setItem('tloc_theme', th); } catch (e) {}
      };
    });
  })();
</script>
<link rel="stylesheet" href="tloc-portail.css?v=8">
</head>
<body>
<button type="button" class="interrupteur coin-theme" id="basculeTheme" role="switch" aria-checked="false" aria-label="Thème clair" title="Thème clair ou sombre">
    <span class="piste"><span class="curseur">
      <svg class="lune" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="soleil" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </span></span>
  </button>
<div class="page etroite">
  <header>
    <img src="favicon.svg" alt="">
    <h1 class="logo" style="font-size:clamp(44px,11vw,64px)">The Legend of Camille</h1>
    <p class="sous" style="margin-bottom:0">La Citadelle de Lille</p>
  </header>

  <section class="carte">
    <div class="onglets">
      <button id="ongletConnexion" class="actif">Se connecter</button>
      <button id="ongletInscription">Créer un compte</button>
    </div>
    <p class="aide" id="aideCompte">Ton compte retrouve tes parties d'un ordinateur à l'autre et ouvre les instances à plusieurs.</p>
    <div id="formCompte" style="display:grid; gap:12px">
      <div><label for="pseudo">Pseudo</label><input id="pseudo" autocomplete="username" maxlength="16" placeholder="Camille"></div>
      <div><label for="mdp">Mot de passe</label><input id="mdp" type="password" autocomplete="current-password" maxlength="128" placeholder="six caractères au moins"></div>
      <button class="plein large grand" id="valider">Se connecter</button>
    </div>
    <div class="msg" id="msgCompte"></div>
  </section>

  <p style="text-align:center; margin:18px 0 0">
    <button class="lien" id="sansCompte">Jouer sans compte, sur ce navigateur</button>
  </p>
  <p class="aide" style="text-align:center; margin:0 auto">Sans compte, tes parties restent ici et le multijoueur est indisponible.</p>

  <footer>
    Phinaert a enlevé le prince Eugène. Camille part le délivrer.
  </footer>
</div>
<div class="toasts" id="toasts" aria-live="assertive"></div>
<script type="module" src="connexion.js?v=3"></script>
</body>
</html>
